name: Build and publish Android APK
on:
  push:
    branches: [main]
    paths:
      - 'app/build.gradle'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: commander-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK packages
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Check signing secrets
        env:
          KEYSTORE: ${{ secrets.CLC_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.CLC_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.CLC_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.CLC_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Set the four CLC signing secrets before publishing updates. See README."
            exit 1
          fi
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/commander-signing.keystore"
      - name: Read app version
        id: version
        run: |
          VERSION=$(sed -n 's/.*versionName "\([^"]*\)".*/\1/p' app/build.gradle | head -1)
          test -n "$VERSION"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
      - name: Build signed debug APK
        env:
          CLC_KEYSTORE_PATH: ${{ runner.temp }}/commander-signing.keystore
          CLC_KEYSTORE_PASSWORD: ${{ secrets.CLC_KEYSTORE_PASSWORD }}
          CLC_KEY_ALIAS: ${{ secrets.CLC_KEY_ALIAS }}
          CLC_KEY_PASSWORD: ${{ secrets.CLC_KEY_PASSWORD }}
        run: gradle --no-daemon assembleDebug
      - name: Upload APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: CommanderLifeCounter-${{ steps.version.outputs.tag }}-APK
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; leaving it unchanged."
          else
            gh release create "$TAG" app/build/outputs/apk/debug/app-debug.apk \
              --target "$GITHUB_SHA" \
              --title "Commander Life Counter $TAG" \
              --notes "Automatisch gebouwde Android APK voor $TAG."
          fi
