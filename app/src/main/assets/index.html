</style></head><body><div id="rotateNotice"><div class="rotateInner"><div class="rotateIcon">↻</div><strong>Draai je telefoon naar liggende stand</strong><p>Commander Life Counter is ontworpen om liggend te spelen. Zet automatisch draaien aan als het scherm niet meedraait.</p><button id="tryLandscape" type="button">Probeer liggende modus</button></div></div><div id="app"></div><script>

function artSection(i){const p=players[i],a=artItems.find(x=>x.id===p.backgroundId);return `<div class="profilePanel"><b>Achtergrond voor ${esc(p.name)}</b><p class="hint">${a?'Geselecteerd: '+esc(a.name):'Mana-kleuren (standaard)'}</p><button class="primary" style="width:100%" onclick="openArtPicker(${i})">🖼 Achtergrond kiezen</button></div>`}

function closeArtPicker(i){document.getElementById('artPickerScreen')?.remove();if(artPickerOrigin==='setup')setup();else if(artPickerOrigin==='settings')settings();else if(i!==null&&editing!==null)modal();else if(stage===2)settings();else draw()}

function bg(p){const c=[...new Set(p.commanders.flatMap(x=>x.colors))];if(!c.length&&p.quickHue!==undefined)return `linear-gradient(150deg,hsl(${p.quickHue} 75% 49%),hsl(${p.quickHue} 66% 26%))`;if(!c.length&&p.quickColor)c.push(p.quickColor);return c.length?`linear-gradient(110deg,${c.map((x,i)=>`${palette[x]} ${i*100/c.length}%,${palette[x]} ${(i+1)*100/c.length}%`).join(',')})`:palette.C}

function tableLayout(n,type){
 const cells=[];
 if(type==='around' && [3,5,7,9].includes(n)){
  // Equal-area tiles: the right-hand seat gets exactly 1/n of the board;
  // the remaining n-1 seats form two equal rows.
  const perRow=(n-1)/2;
  const cols=n*perRow, leftCols=(n-1)*perRow;
  for(let j=0;j<perRow;j++){
   const col=j*(n-1)+1;
   cells[j]={row:1,col,rs:6,cs:n-1,angle:180};
   cells[perRow+j]={row:7,col,rs:6,cs:n-1,angle:0};
  }

 }
 if(type==='around' && n>=3){

  // is divided into equal, full-height seats. No 60-track grid gaps.
  const sideCount=n<=5?1:n<=8?2:3;
  const centerCount=n-sideCount*2;
  const tracks=12;
  const add=(start,num,col,width,angle)=>{
   for(let j=0;j<num;j++){
    const top=Math.round(j*tracks/num)+1;
    const bottom=Math.round((j+1)*tracks/num)+1;
    cells[start+j]={row:top,col,rs:bottom-top,cs:width,angle};
   }
  };

function setup(){const previousSetup=app.querySelector('.setup');const previousSetupScroll=previousSetup?previousSetup.scrollTop:0;stage=0;app.style.backgroundImage='none';app.className='';app.innerHTML=`<div class="setup"><div class="box"><h2>Nieuwe Commander game</h2><div class="profilePanel" style="margin:10px 0"><strong>App-updates · v50</strong><p class="hint">Controleer of er een nieuwe versie op GitHub staat. Spelen werkt ook zonder internet.</p><button type="button" onclick="checkCommanderUpdate()">↻ Controleren op updates</button><p id="updateCheckStatus" class="hint" role="status" aria-live="polite"></p></div><p>Aantal spelers (1–10)</p><div class="row"><button onclick="count=Math.max(1,count-1);setup()">−</button><b style="font-size:28px">${count}</b><button onclick="count=Math.min(10,count+1);setup()">+</button></div><p>Startlevens</p><div class="row">${[20,30,40,'custom'].map(v=>`<button class="${starting==v?'active':''}" onclick="starting=${typeof v==='number'?v:"'custom'"};setup()">${v==='custom'?'Custom':v}</button>`).join('')}</div>${starting==='custom'?`<input type="number" min="1" value="${custom}" oninput="custom=this.value">`:''}<p>Tafeloriëntatie</p><div class="orientationChoices"><button class="${orientation==='opposite'?'active':''}" onclick="orientation='opposite';setup()"><span class="orientationSketch">${orientationSketch('opposite')}</span><small>Tegenover elkaar</small></button><button class="${orientation==='around'?'active':''}" onclick="orientation='around';setup()"><span class="orientationSketch">${orientationSketch('around')}</span><small>Rondom tafel</small></button></div><p class="hint">Hierna stel je iedere speler in vanuit zijn eigen vak op de tafel.</p><div class="artTools"><button onclick="openArtPicker(null)">🖼 Spelerachtergronden beheren</button><small class="hint">Beschikbaar voor alle spelers en presets</small></div>${tableBackgroundControls()}<button style="width:100%;margin-bottom:8px;background:#303144" onclick="quickGa function beginSetup(quick=false){const n=Number(starting==='custom'?custom:starting);if(!Number.isFinite(n)||n<1)return alert('Vul geldige startlevens in');players.forEach((p,i)=>{p.life=n;p.poison=0;p.cantLose=false;if(quick){p.commanders=[{name:'Commander 1',colors:[]}]}p.quickColor=['R','W','U','B','G','R','U','G','W','B'][i];p.quickHue=quick?[350,48,198,270,132,23,178,312,80,225][i]:undefined});damage={};history=[];deathSeen.fill(false);deathTransitions.fill(null);active=null;poisonMode=false;angelMode=false;stage=1;draw()}

function gesture(el,commit,preview,getBase,numberSelector,clampZero=false){
 let start=null,startX=null,base=0,indicator=null;
 const number=el.querySelector(numberSelector);
 const original=number?number.textContent:'';
 function paint(dy){const tile=el.closest('.tile');if(tile?.classList.contains('facingAway'))dy=-dy;let delta=preview(dy),next=base+delta;if(clampZero)next=Math.max(0,next);if(number){if(numberSelector==='.poisonCount')number.innerHTML='<span class="poisonDroplet">☠</span> '+next;else number.textContent=next;number.style.transform='none';}if(indicator){indicator.textContent=delta===0?'':(delta>0?'+':'')+delta;indicator.style.opacity=delta===0?'0':'1';}}
 el.addEventListener('pointerdown',e=>{if(e.button!==0||e.target.closest('button'))return;start=e.clientY;startX=e.clientX;base=getBase();el.setPointerCapture(e.pointerId);el.classList.add('gestureActive');indicator=document.createElement('div');indicator.className='dragIndicator';indicator.style.opacity='0';el.appendChild(indicator)});
 el.addEventListener('pointermove',e=>{if(start===null)return;const t=el.closest('.tile');paint(t?.classList.contains('facingLeft')?startX-e.clientX:t?.classList.contains('facingRight')?e.clientX-startX:e.clientY-start)});
 el.addEventListener('pointerup',e=>{if(start===null)return;const r=el.getBoundingClientRect(),t=el.closest('.tile'),left=t?.classList.contains('facingLeft'),right=t?.classList.contains('facingRight');let dy=left?startX-e.clientX:right?e.clientX-startX:e.clientY-start,y=left?r.right-startX:right?startX-r.left:start-r.top,h=(left||right)?r.width:r.height;start=null;el.classList.remove('gestureActive');if(indicator)indicator.remove();indicator=null;if(el.closest('.facingAway')){dy=-dy;y=h-y}commit(dy,y,h)});
 el.addEventListener('pointercancel',()=>{if(start===null)return;start=null;el.classList.remove('gestureActive');if(indicator)indicator.remove();indicator=null;if(number){number.textContent=original;number.style.transform=''}});
}

/* v27: locally saved player profiles and per-player commander presets. */
const PROFILE_KEY='commander-life-counter-profiles-v27';
let savedProfiles={};
try{const loaded=JSON.parse(localStorage.getItem(PROFILE_KEY)||'{}');if(loaded&&typeof loaded==='object'&&!Array.isArray(loaded))savedProfiles=loaded}catch(e){}
function profileNames(){return Object.keys(savedProfiles).sort((a,b)=>a.localeCompare(b,'nl'))}
function saveProfiles(){try{localStorage.setItem(PROFILE_KEY,JSON.stringify(savedProfiles));return true}catch(e){alert('Opslaan is niet gelukt. Controleer of lokale opslag in deze browser is toegestaan.');return false}}
function validCommanders(list){return Array.isArray(list)&&list.length?list.slice(0,5).map((c,i)=>({name:String(c.name||'Commander '+(i+1)),colors:Array.isArray(c.colors)?c.colors.filter(x=>['W','U','B','R','G'].includes(x)):[]})):[{name:'Commander 1',colors:[]}]}
const dropdownSelections={};
function selectionFor(i){return dropdownSelections[i]||(dropdownSelections[i]={player:'',preset:'',presetOwner:''})}
function profileSelect(i){const name=document.getElementById('savedPlayerSelect')?.value;if(!name||!savedProfiles[name])return;const p=players[i];selectedPresetIndex=-1;selectionFor(i).player=name;selectionFor(i).preset='';selectionFor(i).presetOwner=name;p.name=name;p.commanders=validCommanders(savedProfiles[name].presets?.[0]?.commanders||[{name:'Commander 1',colors:[]}]);p.quickHue=undefined;p.quickColor=null;modal()}
function savePlayerProfile(i){const p=players[i];const name=p.name.trim();if(!name)return alert('Vul eerst een spelersnaam in.');p.name=name;if(!savedProfiles[name])savedProfiles[name]={presets:[]};if(saveProfiles()){selectionFor(i).player=name;modal()}}
function removePlayerProfile(i){const name=players[i].name;if(!savedProfiles[name])return;if(!confirm('Speler '+name+' en alle bijbehorende presets verwijderen uit de opgeslagen lijst?'))return;delete savedProfiles[name];selectionFor(i).player='';selectionFor(i).preset='';saveProfiles();modal()}
function saveCommanderPreset(i){const p=players[i],name=p.name.trim();if(!name)return alert('Vul eerst een spelersnaam in.');const label=prompt('Naam voor deze commander-preset (bijvoorbeeld Atraxa of Eldrazi):',p.commanders[0]?.name||'Mijn deck');if(label===null)return;const presetName=label.trim();if(!presetName)return alert('Geef de preset een naam.');p.name=name;if(!savedProfiles[name])savedProfiles[name]={presets:[]};const presets=savedProfiles[name].presets;const index=presets.findIndex(x=>x.name===presetName);if(index>=0&&!confirm('Preset '+presetName+' overschrijven?'))return;const preset={name:presetName,commanders:validCommanders(p.commanders),backgroundId:p.backgroundId||null};if(index>=0)presets[index]=preset;else presets.push(preset);if(saveProfiles()){selectionFor(i).player=name;selectionFor(i).preset=String(index>=0?index:presets.length-1);selectionFor(i).presetOwner=name;selectedPresetIndex=Number(selectionFor(i).preset);modal()}}
let selectedPresetIndex=-1;
function loadCommanderPreset(i){const name=players[i].name,idx=Number(document.getElementById('savedPresetSelect')?.value||'-1'),list=savedProfiles[name]?.presets||[];if(!Number.isInteger(idx)||!list[idx])return;selectedPresetIndex=idx;selectionFor(i).preset=String(idx);selectionFor(i).presetOwner=name;players[i].commanders=validCommanders(list[idx].commanders);players[i].backgroundId=list[idx].backgroundId||null;players[i].quickHue=undefined;players[i].quickColor=null;modal()}
function removeCommanderPreset(i){const name=players[i].name,idx=selectedPresetIndex,list=savedProfiles[name]?.presets||[];if(!Number.isInteger(idx)||!list[idx])return;if(!confirm('Preset '+list[idx].name+' verwijderen?'))return;list.splice(idx,1);selectedPresetIndex=-1;selectionFor(i).preset='';saveProfiles();modal()}
function dropdown(id,placeholder,items,selected=''){const chosen=items.find(x=>String(x.value)===String(selected));return `<div class="compactDropdown" id="${id}Wrap"><input type="hidden" id="${id}" value="${chosen?esc(String(chosen.value)):''}"><button type="button" class="dropdownTrigger" onclick="toggleDropdown('${id}')"><span id="${id}Label">${chosen?esc(chosen.label):placeholder}</span><span class="dropdownChevron">⌄</span></button><div class="dropdownList hidden" id="${id}List">${items.length?items.map(x=>`<button type="button" class="dropdownOption" onclick="pickDropdown('${id}',${JSON.stringify(x.value).replace(/"/g,'&quot;')},${JSON.stringify(x.label).replace(/"/g,'&quot;')})">${esc(x.label)}</button>`).join(''):'<div class="dropdownEmpty">Nog niets opgeslagen</div>'}</div></div>`}
function toggleDropdown(id){const list=document.getElementById(id+'List');const wasHidden=list.classList.contains('hidden');document.querySelectorAll('.dropdownList').forEach(el=>el.classList.add('hidden'));if(wasHidden)list.classList.remove('hidden')}
function pickDropdown(id,value,label){document.getElementById(id).value=value;document.getElementById(id+'Label').textContent=label;document.getElementById(id+'List').classList.add('hidden');document.getElementById(id+'Wrap').classList.add('hasSelection');if(id==='savedPlayerSelect')profileSelect(editing);else if(id==='savedPresetSelect')loadCommanderPreset(editing)}

// A screen wake lock requires a secure context and a user gesture in many browsers.
let screenWakeLock = null;
let wakeRequestPending = false;
async function keepScreenAwake(){
  if(document.visibilityState !== 'visible' || screenWakeLock || wakeRequestPending || !('wakeLock' in navigator)) return;
  wakeRequestPending = true;
  try {
    screenWakeLock = await navigator.wakeLock.request('screen');
    screenWakeLock.addEventListener('release',()=>{screenWakeLock=null;},{once:true});
  } catch(err) { screenWakeLock=null; }
  finally { wakeRequestPending=false; }
}
document.addEventListener('pointerdown',keepScreenAwake,{passive:true});
document.addEventListener('keydown',keepScreenAwake);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')keepScreenAwake();});
document.getElementById('tryLandscape').addEventListener('click',async()=>{
  keepScreenAwake();
  try {
    if(document.documentElement.requestFullscreen && !document.fullscreenElement) await document.documentElement.requestFullscreen();
    if(screen.orientation && screen.orientation.lock) await screen.orientation.lock('landscape');
  }catch(err){ /* Browser may prohibit locking orientation; rotate manually. */ }
});
keepScreenAwake();

let artDB=null;
function openArtDB(){return new Promise((resolve,reject)=>{if(!('indexedDB' in window))return reject(new Error('IndexedDB niet beschikbaar'));const r=indexedDB.open('commander-life-art-v1',1);r.onupgradeneeded=()=>r.result.createObjectStore('images',{keyPath:'id'});r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
async function loadArtLibrary(){try{artDB=await openArtDB();const tx=artDB.transaction('images','readonly');const req=tx.objectStore('images').getAll();req.onsuccess=()=>{artItems=req.result.map(({id,name})=>({id,name}));artImages=Object.fromEntries(req.result.map(a=>[a.id,a.data]));if(stage===0)setup();else if(editing!==null)modal();else draw()}}catch(e){console.warn('Achtergrondopslag niet beschikbaar',e)}}
function importArt(playerIndex){const picker=document.createElement('input');picker.type='file';picker.accept='image/*';picker.onchange=async()=>{const file=picker.files?.[0];if(!file)return;if(!artDB){alert('Afbeeldingen opslaan wordt niet ondersteund in deze browser.');return}try{const img=await createImageBitmap(file);const canvas=document.createElement('canvas');const max=1600;const scale=Math.min(1,max/Math.max(img.width,img.height));canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);img.close?.();const data=canvas.toDataURL('image/jpeg',.83);const id='art'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);const name=file.name.replace(/\.[^.]+$/,'').slice(0,45);await new Promise((resolve,reject)=>{const tx=artDB.transaction('images','readwrite');tx.objectStore('images').put({id,name,data});tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)});artItems.push({id,name});artImages[id]=data;if(playerIndex!==null&&players[playerIndex])players[playerIndex].backgroundId=id;if(document.getElementById('artPickerScreen')?.dataset.tableBg==='1'){saveTableBackground(id);delete document.getElementById('artPickerScreen').dataset.tableBg}else if(document.getElementById('artPickerScreen'))renderArtPicker(playerIndex);else if(stage===0)setup();else if(editing!==null)modal();else if(stage===2)settings();else draw()}catch(e){alert('Afbeelding importeren mislukt: '+e.message)}};picker.click()}

/* Measure actual tile sizes: a 90-degree rotated rectangle must swap width and height. */
(function(){
  function fitPlayerArt(){
    document.querySelectorAll('#app .tile.customArt').forEach(tile=>{
      const r=tile.getBoundingClientRect();
      if(!r.width||!r.height)return;
      tile.style.setProperty('--art-rotated-width',r.height+'px');
      tile.style.setProperty('--art-rotated-height',r.width+'px');
    });
  }
  const app=document.getElementById('app');
  const observer=new MutationObserver(()=>requestAnimationFrame(fitPlayerArt));
  observer.observe(app,{childList:true});
  window.addEventListener('resize',()=>requestAnimationFrame(fitPlayerArt));
  window.addEventListener('orientationchange',()=>requestAnimationFrame(fitPlayerArt));
  requestAnimationFrame(fitPlayerArt);
})();
</script><script>
/* v45: GitHub Releases updatechecker */
const CLC_APP_VERSION=50;
async function checkCommanderUpdate(){
 const el=document.getElementById('updateCheckStatus');
 if(!el)return;
 el.textContent='Controleren op updates…';
 const controller=new AbortController();
 const timeout=setTimeout(()=>controller.abort(),12000);
 try{
  const response=await fetch('https://api.github.com/repos/LionRaxor/CommanderLifeCounter/releases/latest',{cache:'no-store',signal:controller.signal,headers:{'Accept':'application/vnd.github+json'}});
  if(!response.ok)throw new Error('GitHub antwoordde met '+response.status);
  const release=await response.json();
  const match=String(release.tag_name||'').match(/^v(\d+)$/i);
  if(!match)throw new Error('Onbekend versienummer: '+String(release.tag_name||''));
  const newest=Number(match[1]);
  if(newest<=CLC_APP_VERSION){el.textContent='Je hebt de nieuwste versie (v'+CLC_APP_VERSION+').';return}
  const apk=(release.assets||[]).find(a=>/\.apk$/i.test(a.name||''));
  if(!apk){el.textContent='v'+newest+' is beschikbaar, maar er is nog geen APK toegevoegd.';return}
  el.replaceChildren(document.createTextNode('Versie v'+newest+' is beschikbaar. '));
  const btn=document.createElement('button');
  btn.textContent='APK downloaden';
  btn.onclick=()=>{window.location.href=apk.browser_download_url};
  el.appendChild(btn);
 }catch(e){el.textContent='Updatecontrole mislukt. Controleer je internetverbinding en probeer opnieuw. ('+e.message+')'}
 finally{clearTimeout(timeout)}
}
</script></body></html>
